server:
  port: 8080

spring:
  application:
    name: reimbursement-backend
  
  # 数据库配置
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=reimbursement;encrypt=false;trustServerCertificate=true
    username: sa
    password: 123456  # 改成你的SQL Server密码
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

# MyBatis Plus配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: reimbursement-secret-key-2026-spring-boot-vue-3
  expiration: 86400000  # 24小时

# 文件存储路径
file:
  upload:
    path: D:/reimbursement-upload/
  temp: D:/reimbursement-temp/

# 日志配置
logging:
  level:
    com.student: debug
    org.springframework.security: info